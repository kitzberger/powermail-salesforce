categories:
  powermailsalesforce:
    label: Powermail Salesforce Finisher

settings:
  plugin.tx_powermailsalesforce.targetUrl:
    type: string
    default: 'https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8'
    label: Target URL
    category: powermailsalesforce
  plugin.tx_powermailsalesforce.debug.enable:
    type: bool
    default: '0'
    label: Enable Debug mode
    category: powermailsalesforce
  plugin.tx_powermailsalesforce.debug.targetUrl:
    type: string
    default: 'https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8'
    label: Debug target url (Sandbox)
    category: powermailsalesforce
  plugin.tx_powermailsalesforce.debug.email:
    type: string
    default: ''
    label: Debug email address
    category: powermailsalesforce
  plugin.tx_powermailsalesforce.web2case.instanceUrl:
    type: string
    default: ''
    label: 'Web-to-Case: Salesforce Instance URL'
    category: powermailsalesforce
  plugin.tx_powermailsalesforce.web2case.clientId:
    type: string
    default: ''
    label: 'Web-to-Case: OAuth2 Client ID'
    category: powermailsalesforce
  plugin.tx_powermailsalesforce.web2case.clientSecret:
    type: string
    default: ''
    label: 'Web-to-Case: OAuth2 Client Secret'
    category: powermailsalesforce
  plugin.tx_powermailsalesforce.web2case.apiVersion:
    type: string
    default: 'v64.0'
    label: 'Web-to-Case: Salesforce API Version'
    category: powermailsalesforce
